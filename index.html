<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nilupul Hettiarachchi</title>
<meta name="description" content="Nilupul Hettiarachchi - Personal website.">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: radial-gradient(ellipse at 30% 30%, #1a1a1a 0%, #000000 70%);
    color: #ffffff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 60px 30px;
    position: relative;
    overflow: hidden;
  }

  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #ffffff 100%, transparent),
      radial-gradient(1px 1px at 70% 10%, #ffffff 100%, transparent),
      radial-gradient(1px 1px at 40% 80%, #ffffff 100%, transparent),
      radial-gradient(1px 1px at 90% 60%, #ffffff 100%, transparent),
      radial-gradient(1px 1px at 55% 45%, #ffffff 100%, transparent),
      radial-gradient(1px 1px at 15% 65%, #ffffff 100%, transparent),
      radial-gradient(1px 1px at 85% 85%, #ffffff 100%, transparent),
      radial-gradient(1px 1px at 60% 20%, #ffffff 100%, transparent);
    background-repeat: repeat;
    background-size: 300px 300px;
    opacity: 0.5;
    z-index: 0;
    animation: twinkle 3s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.3; }
    50% { opacity: 0.7; }
    100% { opacity: 0.4; }
  }

  .content {
    position: relative;
    z-index: 1;
    max-width: 750px;
  }

  .intro {
    font-size: 1.1rem;
    color: #999999;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .heading {
    font-size: 3rem;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 1.1;
    letter-spacing: 1px;
  }

  .subtext {
    margin-top: 25px;
    font-size: 1.1rem;
    color: #cccccc;
    line-height: 1.6;
    max-width: 550px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 35px;
    padding: 14px;
    width: 48px;
    height: 48px;
    border: 1px solid #ffffff;
    color: #ffffff;
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .btn:hover {
    background: #ffffff;
    color: #000000;
  }

  @media (max-width: 480px) {
    .heading {
      font-size: 2.1rem;
    }
    body {
      padding: 40px 20px;
    }
  }
</style>
</head>
<body>

  <div class="stars"></div>

  <div class="content">
    <div class="intro">Hi, I'm</div>
    <div class="heading">Nilupul Hettiarachchi</div>
    <div class="subtext">
      I am a beginner in the IT field with a passion for learning technology and developing my skills.
    </div>
    <a class="btn" href="https://x.com/nilupulhet" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </a>
  </div>

</body>
</html>
